name: One-shot repository consolidation

on:
  push:
    paths:
      - ".github/workflows/consolidate-related-repos.yml"

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate repositories
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            job-shop-scheduling-ppo
            neural-large-neighborhood-search-job-shop-scheduling-pytorch
            job-shop-lib-rl-scheduling
            learning-augmented-online-machine-scheduling-python
            dqn-job-shop-scheduling
            dynamic-automotive-paint-shop-scheduling-rl
            reinforcement-learning-job-shop-scheduling-pytorch
            fjsp-ml-rescheduling
          )
          mkdir -p projects
          for repo in "${sources[@]}"; do
            if [ -d "projects/$repo" ]; then
              echo "Skipping existing projects/$repo"
              continue
            fi
            tmp="$(mktemp -d)"
            git clone --depth 1 "https://github.com/jorsacademy/$repo.git" "$tmp/repo"
            sha="$(git -C "$tmp/repo" rev-parse HEAD)"
            rm -rf "$tmp/repo/.git"
            mkdir -p "projects/$repo"
            cp -a "$tmp/repo/." "projects/$repo/"
            cat > "projects/$repo/SOURCE_REPOSITORY.md" <<EOF
          # Source repository
          
          Copied from https://github.com/jorsacademy/$repo
          
          Source commit: `$sha`
          
          The original repository remains unchanged.
          EOF
            rm -rf "$tmp"
          done
          rm -f .github/workflows/consolidate-related-repos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects .github/workflows/consolidate-related-repos.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Consolidate learning-based scheduling projects"
          git push
