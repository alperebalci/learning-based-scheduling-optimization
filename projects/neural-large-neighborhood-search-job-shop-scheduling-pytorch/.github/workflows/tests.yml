name: tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          pip install "numpy>=1.24"
      - run: python run_neural_lns_jssp.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: |
          python run_neural_lns_jssp.py \
            --seed 42 --jobs 3 --machines 3 --block-length 4 \
            --train-instances 8 --epochs 8 --test-instances 4 --iterations 3
