[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-augmented-online-machine-scheduling"
version = "0.1.0"
description = "Robust predicted-LPT scheduling on identical parallel machines with exact makespan evaluation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
include = ["la_scheduling*"]
