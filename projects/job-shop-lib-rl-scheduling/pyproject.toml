[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-shop-lib-rl-scheduling"
version = "0.1.0"
description = "Dispatching baselines and Gymnasium RL environment examples with job-shop-lib"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "job-shop-lib==1.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
job-shop-demo = "job_shop_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=job_shop_demo --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
